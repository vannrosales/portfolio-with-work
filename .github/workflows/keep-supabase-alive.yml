name: Keep Supabase Active

on:
  schedule:
    # Runs every 12 hours to guarantee continuous Postgres database activity
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query and Touch Supabase Postgres Database
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ANON_KEY="${SECRET_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50bHJvdm1pcm1kam5lZ2ZsaXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjczMjIsImV4cCI6MjEwNzkwMzMyMn0.iVG1DJTh-H_cZTR5xRvsE0DMw196_LZzWZo6AxYMUmI}"
          
          # 1. Read query on desk_notes
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://ntlrovmirmdjnegfliqq.supabase.co/rest/v1/desk_notes?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "desk_notes SELECT ($HTTP_STATUS): $BODY"
          
          # 2. Write/update heartbeat timestamp on site_stats
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WRITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "https://ntlrovmirmdjnegfliqq.supabase.co/rest/v1/site_stats?id=eq.global" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"updated_at\": \"$NOW_UTC\"}")
          echo "site_stats UPDATE ($WRITE_STATUS) at $NOW_UTC"
          
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Ping failed with status $HTTP_STATUS"
            exit 1
          fi
